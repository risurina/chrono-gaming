[workspace]
resolver = "2"
members = ["src-tauri", "crates/chrono-control", "guard"]

# Release hardening shared by every workspace binary. `strip = true` removes
# symbols so shipped binaries carry no readable logic — this is what makes the
# separate JS-obfuscation step unnecessary for the Rust service.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
