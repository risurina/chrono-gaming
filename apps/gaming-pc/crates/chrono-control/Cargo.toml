[package]
name = "chrono-control"
version = "0.1.3"
edition = "2021"
description = "Shared station-control-channel contract (auth + sealed state) for the Chrono client and guard service"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
