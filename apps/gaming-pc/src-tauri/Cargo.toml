[package]
name = "chrono-pc-client"
version = "0.1.3"
description = "Secure workstation shell for Chrono iCafe management"
authors = ["IZUR IT SOLUTIONS"]
edition = "2021"

[lib]
name = "chrono_pc_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono-control = { path = "../crates/chrono-control" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
hex = "0.4"
base64 = "0.22"
machine-uid = "0.5"
sysinfo = "0.33"
mac_address = "1.1"
# native-tls: SChannel on Windows, Security.framework on macOS — avoids ring's
# C build step so the app cross-checks cleanly from macOS to the Windows target.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "cookies"] }
tokio = { version = "1", features = ["time"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
dotenvy = "0.15"
rust_socketio = { version = "0.6", features = ["async"] }
futures-util = "0.3"
sentry = { version = "0.48.3", default-features = false, features = ["backtrace", "contexts", "panic", "debug-images", "reqwest", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

# NOTE: [profile.release] lives in the workspace root Cargo.toml
# (../Cargo.toml); Cargo ignores profiles declared in workspace members.
