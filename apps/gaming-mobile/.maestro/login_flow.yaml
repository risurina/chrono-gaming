appId: com.izur.chrono
---
- launchApp
- assertVisible: "Your gaming session starts here."
- tapOn: "I ALREADY HAVE AN ACCOUNT"
- assertVisible: "Welcome back"
- tapOn: "Email"
- inputText: "john.customer@example.com"
- tapOn: "Password"
- inputText: "password123"
- hideKeyboard
- tapOn: "Continue"
# After sign-in the customer picks/joins a venue (unless they already have exactly
# one membership, in which case they land straight on the dashboard).
- assertVisible: "Join your gaming cafe"
